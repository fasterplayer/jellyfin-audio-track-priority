framework: "net9.0"
overview: "Default audio and subtitle track selection by track title, per language."
description: >
  Picks the default audio and subtitle track by their Title field when several
  tracks share the same ISO language code, such as a Quebec French (VFQ) dub
  next to a France French (VFF) dub, both tagged "fra". Define, per language,
  an ordered list of title patterns and Jellyfin will default to the first
  match. No media file is modified.
category: "General"
owner: "fasterplayer"
